AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This template creates the core ECS infrastructure. It uses the default VPC's
  subnets and security group for simplicity and reliability.

Parameters:
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket the application needs to write to.
  DockerImageUri:
    Type: String
    Description: The full URI of the Docker image to be deployed.
  SubnetIdOne:
    Type: AWS::EC2::Subnet::Id
    Description: The ID of the first subnet for the ECS service.
  SubnetIdTwo:
    Type: AWS::EC2::Subnet::Id
    Description: The ID of the second subnet for the ECS service.
  DefaultSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The ID of the default security group for the VPC.

Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: secret-mission

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: secret-mission-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/secret-mission-task

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ECSTaskExecutionRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  AppTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "AppTaskRole-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3WritePolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: secret-mission-task
      RequiresCompatibilities: ["FARGATE"]
      NetworkMode: awsvpc
      Cpu: 256
      Memory: 512
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      ContainerDefinitions:
        - Name: secret-mission-container
          Image: !Ref DockerImageUri
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: production
            - Name: APP_S3_BUCKET_NAME
              Value: !Ref S3BucketName

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: secret-mission-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref SubnetIdOne
            - !Ref SubnetIdTwo
          SecurityGroups:
            - !Ref DefaultSecurityGroupId
AWSTemplateFormatVersion: '2010-09-09'
Description: Simple S3 bucket notification configuration for db-conversor Lambda

Parameters:
  S3BucketName:
    Type: String
    Description: Name of the existing S3 bucket
  ConversorLambdaArn:
    Type: String
    Description: ARN of the Lambda function to trigger

Resources:
  # Permission for S3 to invoke the Lambda function
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConversorLambdaArn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${S3BucketName}"

Outputs:
  PermissionArn:
    Description: ARN of the Lambda permission
    Value: !Ref S3InvokePermission
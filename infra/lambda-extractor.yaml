AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This template defines the Extractor Lambda function,
  which reads data from DynamoDb and writes it as a JSON file to an S3 Bucket.

Parameters:
  DynamoDbTableName:
    Type: String
    Description: The name of the DynamoDB table to read from.
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket to write the output file to.

Resources:
  LambdaExtractorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LambdaExtractorPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDbTableName}"

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  Extractor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: db-extractor-lambda
      Runtime: python3.11
      Handler: lambda_function.lambda_handler

      Role: !GetAtt LambdaExtractorRole.Arn
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: "lambda-artifacts/db-extractor.zip"

      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDbTableName
          S3_BUCKET_NAME: !Ref S3BucketName
      Timeout: 30 #seconds
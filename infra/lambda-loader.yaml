AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  DynamoDbTableName:
    Type: String
    Description: The name of the DynamoDB table to read from.
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket that stores the Lambda code.

Resources:
  # iam role for the data loader lambda
  DataLoaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBBatchWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDbTableName}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  # the lambda function resource
  DataLoaderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: data-loader-lambda
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt DataLoaderRole.Arn
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: "lambda-artifacts/data-loader.zip"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDbTableName
      Timeout: 300


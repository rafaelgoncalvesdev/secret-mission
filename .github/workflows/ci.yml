# A descriptive name for our workflow, which will appear in the "Actions" tab on GitHub.
name: CI - Build and Push Docker Image

# This section defines the trigger for the workflow.
# It will run automatically on any 'push' event to the 'dev' branch.
on:
  push:
    branches: [ "dev" ]

# A workflow is made up of one or more "jobs". We have one job here.
jobs:
  build-and-push-image:
    # This job will run on a virtual machine using the latest version of Ubuntu.
    runs-on: ubuntu-latest

    # We need to grant special permissions to this job so it can write (push)
    # packages (our Docker image) to the GitHub Container Registry.
    permissions:
      contents: read
      packages: write

    # A job is made up of a sequence of "steps".
    steps:
      # Step 1: Check out the repository's code
      # The 'uses' keyword tells the job to run a pre-built action.
      # 'actions/checkout@v4' is the official action for cloning your repository onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      # This step ensures that Java version 17 is available on the runner,
      # which is a good practice for Java-based projects.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Log in to the GitHub Container Registry (GHCR)
      # This action securely logs Docker into GHCR.
      # The GITHUB_TOKEN is a temporary, secure password automatically generated by GitHub for each workflow run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Build and push the Docker image
      # This is the main action. It uses our Dockerfile to build the image and then pushes it to GHCR.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # 'context: .' tells the action to use the root of our repository as the build context.
          context: .
          # We are explicitly telling it where our Dockerfile is located.
          file: ./Dockerfile
          # 'push: true' tells the action to push the image after a successful build.
          push: true
          # This automatically creates a good tag for our image, like ghcr.io/your-username/secret-mission:dev
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

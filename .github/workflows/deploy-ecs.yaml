name: Deploy ECS Service

on:
  workflow_call:

jobs:
  deploy-ecs:
    name: Deploy ECS Task and Service
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: get aws account id
        id: get-account-id
        run: echo "aws_account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: substitute execution role arn
        run: |
          EXECUTION_ROLE_ARN="arn:aws:iam::${{ env.aws_account_id }}:role/ECSTaskExecutionRole"
          sed -i "s|EXECUTION_ROLE_ARN_PLACEHOLDER|${EXECUTION_ROLE_ARN}|g" infra/task-definition.json

      - name: log in to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: render amazon ecs task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: secret-mission-container
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: deploy amazon ecs task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: secret-mission-service
          cluster: secret-mission-cluster
          wait-for-service-stability: true

# This is the final, unified CI/CD pipeline, with the corrected zip command.
name: CI/CD - Build, Package, and Deploy to AWS

on:
  push:
    branches:
      - "dev"

jobs:
  # --- JOB 1: BUILD ---
  build:
    name: Build Docker and Package Lambda
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Zip Lambda function code
        run: |
          cd lambda-functions/db-extractor
          zip -r ../db-extractor.zip .

      - name: Upload Lambda zip file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-extractor-lambda-zip
          path: lambda-functions/db-extractor.zip

      # NEW: packaging for the data loader lambda
      - name: Zip Data Loader Lambda function
        run: |
          cd lambda-functions/data-loader
          zip -r ../data-loader.zip .

      # NEW: uploading the new artifact
      - name: Upload Data Loader Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-loader-lambda-zip
          path: lambda-functions/data-loader.zip

  # --- JOB 2: DEPLOY ---
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Download Lambda zip artifact
        uses: actions/download-artifact@v4
        with:
          name: db-extractor-lambda-zip
          path: lambda-artifacts

      - name: Upload Lambda zip to S3
        run: |
          aws s3 cp lambda-artifacts/db-extractor.zip s3://${{ secrets.S3_BUCKET_NAME }}/lambda-artifacts/db-extractor.zip

      - name: Deploy Extractor Lambda to CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name secret-mission-extractor-lambda \
            --template-file infra/lambda-extractor.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DynamoDbTableName=${{ secrets.DYNAMODB_TABLE_NAME }} \
              S3BucketName=${{ secrets.S3_BUCKET_NAME }}
          
        # deployment for the data loader lambda
      - name: Download Data Loader Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: data-loader-lambda-zip
      - name: Upload Data Loader Lambda zip to S3
        run: |
          aws s3 cp data-loader.zip s3://${{ secrets.S3_BUCKET_NAME }}/lambda-artifacts/data-loader.zip
      - name: Deploy Data Loader Lambda
        run: |
          aws cloudformation deploy \
            --stack-name secret-mission-data-loader-lambda \
            --template-file infra/lambda-loader.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DynamoDbTableName=${{ secrets.DYNAMODB_TABLE_NAME }} \
              S3BucketName=${{ secrets.S3_BUCKET_NAME }} 

      - name: Get AWS Account ID
        id: get-account-id
        run: echo "aws_account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Substitute Execution Role ARN
        run: |
          EXECUTION_ROLE_ARN="arn:aws:iam::${{ env.aws_account_id }}:role/ECSTaskExecutionRole"
          sed -i "s|EXECUTION_ROLE_ARN_PLACEHOLDER|${EXECUTION_ROLE_ARN}|g" infra/task-definition.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: secret-mission-container
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: secret-mission-service
          cluster: secret-mission-cluster
          wait-for-service-stability: true
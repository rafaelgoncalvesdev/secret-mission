
name: CI/CD - Build, Package, and Deploy to AWS

on:
  push:
    branches:
      - "dev"

jobs:
  # --- JOB 1: BUILD ---
  # This job contains all the steps from your ci.yml file.
  # It is responsible for building all artifacts.
  build:
    name: Build Docker and Package Lambda
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        # This step is taken directly from your file.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Zip Lambda function code
        run: |
          cd lambda-functions/db-extractor
          zip -r ../db-extractor.zip .

      - name: Upload Lambda zip file as artifact
        # This step makes the zip file available to the NEXT job.
        uses: actions/upload-artifact@v4
        with:
          name: db-extractor-lambda-zip
          path: lambda-functions/db-extractor.zip

  # --- JOB 2: DEPLOY ---
  # This job contains all the steps from your cd.yml file.
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    # THIS IS THE CRITICAL FIX: The 'needs' keyword tells GitHub
    # to wait until the 'build' job has completed successfully
    # before starting this 'deploy' job.
    needs: build
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Download Lambda zip artifact
        # This can now safely download the artifact because the 'build' job is guaranteed to be finished.
        uses: actions/download-artifact@v4
        with:
          name: db-extractor-lambda-zip
          path: lambda-artifacts

      - name: Upload Lambda zip to S3
        run: |
          aws s3 cp lambda-artifacts/db-extractor.zip s3://${{ secrets.S3_BUCKET_NAME }}/lambda-artifacts/db-extractor.zip

      - name: Deploy Extractor Lambda to CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name secret-mission-extractor-lambda \
            --template-file infra/lambda-extractor.yml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DynamoDbTableName=${{ secrets.DYNAMODB_TABLE_NAME }} \
              S3BucketName=${{ secrets.S3_BUCKET_NAME }}

      # --- ECS Deployment Steps ---
      - name: Get AWS Account ID
        id: get-account-id
        run: echo "aws_account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Substitute Execution Role ARN
        run: |
          EXECUTION_ROLE_ARN="arn:aws:iam::${{ env.aws_account_id }}:role/ECSTaskExecutionRole"
          sed -i "s|EXECUTION_ROLE_ARN_PLACEHOLDER|${EXECUTION_ROLE_ARN}|g" infra/task-definition.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: secret-mission-container
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: secret-mission-service
          cluster: secret-mission-cluster
          wait-for-service-stability: true